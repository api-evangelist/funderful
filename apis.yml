name: Funderful
description: >-
  Funderful was an alumni fundraising software platform for universities and higher-education advancement
  teams, founded in 2013 by Raimonds Kulbergs and headquartered in Riga, Latvia. It helped advancement
  offices run donation campaigns, track donors, and pioneer conversational chatbots to re-engage alumni,
  with clients including UC Berkeley, Georgetown, London Business School, and Oxford and Cambridge colleges.
  Funderful joined 500 Startups (Batch 20) and raised seed funding before being acquired by Ruffalo Noel
  Levitz (RNL) in February 2019. The company is defunct as an independent entity and its domain
  (funderful.com) no longer resolves; enrichment found no live developer portal, documentation, or public API surface.
